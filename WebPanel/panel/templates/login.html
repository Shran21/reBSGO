<!-- github.com/Shran21 -->
<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>{{ t('login.title') }} · {{ t('panel.title') }}</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/panel.css?v={{ asset_v }}">
<script nonce="{{ nonce }}">try{var m=localStorage.getItem("panel_theme");if(m==="light"||m==="dark"){document.documentElement.dataset.theme=m;}}catch(e){}</script>
</head>
<body class="login-body">
  <form class="login-card" method="post" action="/login" autocomplete="off">
    <div class="login-brand">
      <span class="brand-mark">{% include "_mark.html" %}</span>
      <div><b>reBSGO</b><span>{{ t('panel.sub') }}</span></div>
    </div>
    {% if error %}<p class="flash flash-error">{{ error }}</p>{% endif %}
    <label class="field">
      <span>{{ t('login.name') }}</span>
      <input name="name" required autofocus autocapitalize="none" autocorrect="off">
    </label>
    <label class="field">
      <span>{{ t('login.password') }}</span>
      <input name="password" type="password" required>
    </label>
    <button class="btn btn-primary" type="submit">{{ t('login.submit') }}</button>
    <p class="hint">{{ t('login.hint') }}</p>
    <div class="login-lang">
      {% for code in langs %}
        <a href="/lang/{{ code }}" {% if code == lang %}class="active"{% endif %}>{{ code|upper }}</a>
      {% endfor %}
      <button class="themebtn" type="button" data-theme-toggle
              aria-label="{{ t('theme.toggle') }}" title="{{ t('theme.toggle') }}">
        <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="ic-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
      </button>
    </div>
    <div class="version mono dim login-version"><a class="home" href="https://github.com/Shran21" target="_blank" rel="noopener">github.com/Shran21</a> · {{ version }}</div>
  </form>
  <script type="application/json" id="panel-i18n">{{ js_strings | tojson }}</script>
  <script src="/static/panel.js?v={{ asset_v }}"></script>
</body>
</html>
